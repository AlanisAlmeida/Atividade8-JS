<head>

<body>

<script>
let user = prompt("Pedra, papel ou tesoura?");
let op = ["pedra","papel","tesoura"];
let pc = op[Math.floor(Math.random()*3)];

let resultado;

if(user == pc){
    resultado = "Empate";
}
else if(user == "pedra" && pc == "tesoura" ||
        user == "papel" && pc == "pedra" ||
        user == "tesoura" && pc == "papel"){
    resultado = "Você venceu";
}
else{
    resultado = "PC venceu";
}

alert("PC: " + pc + "\nResultado: " + resultado);
</script>

</body>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 17</title>
    <button><a href="index.html">Voltar para a lista de Atividades</a></button>
</head>
<body>

<button onclick="iluminar()">Iluminar</button>
<style>
    body {
        background-color: black;
    }
</style>

<script>
let brilho = 0;

function iluminar(){
    brilho += 20;

    if(brilho > 255){
        brilho = 255;
    }

    document.body.style.backgroundColor =
        "rgb(" + brilho + "," + brilho + "," + brilho + ")";
}
</script>

</body>
</html>

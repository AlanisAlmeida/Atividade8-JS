<body>

<script>
let p = prompt("Peso");
let a = prompt("Altura");

let imc = p/(a*a);

if(imc < 18.5){
   alert(imc += " - Abaixo do peso");
}
if(imc >= 18.5 && imc < 25){
    alert(imc += " - Peso normal");
}
if(imc >= 25 && imc < 30){
    alert(imc += " - Sobrepeso");
}


</script>
